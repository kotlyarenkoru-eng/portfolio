  <style>
    :root{
      --red:#ff0000;
      --black:#000000;
      --gray:#d9d6d6;
      --light:#f4f3f3;
      --white:#ffffff;
      --cyan:#20eae7;
      --sidebar:min(20.4vw, 323px);
      --pad:clamp(28px,4.5vw,72px);
      --content:1240px;
      --font-display:"Styrene A","Arial Black","Helvetica Neue",Arial,sans-serif;
      --font-body:"Styrene B","Helvetica Neue",Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-width:320px;
      color:var(--black);
      background:var(--white);
      font-family:var(--font-body);
      font-size:16px;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:none}
    ::selection{background:var(--cyan);color:var(--black)}

    .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      z-index:40;
      width:var(--sidebar);
      height:100dvh;
      overflow-y:auto;
      color:var(--white);
      background:var(--black);
      border-right:1px solid rgba(255,255,255,.14);
    }

    .sidebar__inner{
      min-height:100%;
      padding:18px 20px 22px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .photo{
      position:relative;
      display:grid;
      place-items:center;
      width:90%;
      margin:0 auto 0 5;
      aspect-ratio:1/1.25;
      min-height:0;
      overflow:hidden;
      background:hidden;
      border:0px solid rgba(255,255,255,.22);
    }

    .photo::before,
    .photo::after{content:none}

    .photo.has-image span{display:none}

    .photo span{
      position:relative;
      z-index:1;
      font:700 11px/1 var(--font-display);
      letter-spacing:.14em;
    }
    .asset-image{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .asset-image[src=""]{display:none}

    .photo .asset-image{
      position:absolute;
      inset:0;
      z-index:2;
    }

    .artifact .asset-image,
    .flow-artifact .asset-image{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .artifact .asset-image{
      position:absolute;
      inset:0;
      z-index:2;
    }

    .artifact.has-image .artifact__shape,
    .artifact.has-image .space-can,
    .artifact.has-image .klever-pack,
    .artifact.has-image .klever-sheet,
    .artifact.has-image .klever-handle{
      opacity:0;
    }

    .artifact.has-image .artifact__label,
    .flow-artifact.has-image .artifact__label{display:none}

    .artifact.has-image,
    .flow-artifact.has-image{
      padding:0;
      display:block;
      background:transparent !important;
      border:0 !important;
      box-shadow:none !important;
    }

    .artifact.has-image > :not(.asset-image),
    .flow-artifact.has-image > :not(.asset-image){
      display:none !important;
    }

    .artifact.has-image .asset-image,
    .flow-artifact.has-image .asset-image{
      position:absolute;
      inset:0;
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .eyebrow{
      margin:0;
      font:700 10px/1.2 var(--font-display);
      letter-spacing:.15em;
      text-transform:uppercase;
      opacity:.55;
    }

    .name{
      margin:10px 0 0;
      max-width:9ch;
      font:700 clamp(30px,2.15vw,40px)/.95 var(--font-display);
      letter-spacing:-.03em;
    }

    .contact{
      display:grid;
      gap:7px;
      margin-top:12px;
      font-size:13px;
      line-height:1.35;
      word-break:break-word;
    }

    .role-block,
    .sidebar-section{
      padding-top:15px;
      border-top:1px solid rgba(255,255,255,.2);
    }

    .role{
      margin:6px 0 0;
      font:500 20px/1.05 var(--font-display);
    }

    .role-secondary{
      margin:10px 0 0;
      max-width:30ch;
      color:rgba(255,255,255,.7);
      font-size:12.5px;
      line-height:1.45;
    }

    .sidebar-section h3{
      margin:0 0 8px;
      font:500 14px/1.1 var(--font-display);
    }

    .sidebar-section p,
    .sidebar-section li{
      font-size:11.5px;
      line-height:1.4;
      color:rgba(255,255,255,.8);
    }

    .sidebar-section p{margin:0}
    .sidebar-section ul{
      margin:0;
      padding:0;
      list-style:none;
      display:grid;
      gap:5px;
    }

    .sidebar-section li{
      position:relative;
      padding-left:14px;
    }

    .sidebar-section li::before{
      content:"";
      position:absolute;
      top:.68em;
      left:0;
      width:5px;
      height:5px;
      background:var(--cyan);
    }

    .route-back{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:8px;
      font:500 12px/1 var(--font-display);
    }

    .route-back::before{
      content:"←";
      color:var(--cyan);
    }

    .main{
      margin-left:var(--sidebar);
      min-height:100vh;
    }

    .page{
      display:none;
      min-height:100vh;
    }

    .page.is-active{display:block}

    .progress{
      position:fixed;
      top:0;
      left:var(--sidebar);
      right:0;
      z-index:80;
      height:4px;
      pointer-events:none;
    }

    .progress span{
      display:block;
      width:0;
      height:100%;
      background:var(--cyan);
    }

    .intro{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      display:grid;
      align-items:end;
      padding:var(--pad);
      background:var(--white);
    }

    .intro::before{
      content:"";
      position:absolute;
      top:-8vh;
      right:-12vw;
      width:58vw;
      height:44vh;
      background:var(--red);
      clip-path:polygon(20% 0,100% 0,100% 78%,0 100%);
    }

    .intro::after{
      content:"";
      position:absolute;
      right:8vw;
      bottom:6vh;
      width:18vw;
      min-width:180px;
      aspect-ratio:1;
      background:var(--cyan);
      clip-path:polygon(10% 0,100% 15%,85% 100%,0 77%);
    }

    .intro__content{
      position:relative;
      z-index:2;
      width:min(100%,var(--content));
      display:grid;
      gap:28px;
    }

    .intro h2{
      margin:0;
      max-width:11ch;
      font:700 clamp(58px,8.4vw,148px)/.84 var(--font-display);
      letter-spacing:-.03em;
      text-transform:uppercase;
    }

    .intro__copy{
      max-width:760px;
      margin:0;
      font-size:clamp(17px,1.5vw,22px);
      line-height:1.42;
    }

    .chapter{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      padding:clamp(64px,8vh,110px) var(--pad);
      border-top:1px solid rgba(0,0,0,.14);
    }

    .chapter--gray{background:var(--light)}
    .chapter--dark{background:var(--black);color:var(--white)}
    .chapter--red{background:var(--red);color:var(--white)}

    .chapter--red::after{
      content:"";
      position:absolute;
      right:-13%;
      bottom:-17%;
      width:34vw;
      aspect-ratio:1;
      background:var(--black);
      clip-path:polygon(18% 0,100% 14%,82% 100%,0 82%);
    }

    .chapter__number{
      position:absolute;
      top:3vh;
      right:2vw;
      z-index:0;
      pointer-events:none;
      color:rgba(0,0,0,.07);
      font:700 clamp(82px,12vw,190px)/1 var(--font-display);
      letter-spacing:-.08em;
    }

    .chapter--dark .chapter__number,
    .chapter--red .chapter__number{
      color:rgba(255,255,255,.09);
    }

    .chapter__inner{
      position:relative;
      z-index:2;
      width:min(100%,var(--content));
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1.06fr) minmax(330px,.94fr);
      gap:clamp(42px,5vw,82px);
      align-items:center;
    }

    .chapter__kicker{
      display:flex;
      flex-wrap:wrap;
      gap:8px 18px;
      margin-bottom:20px;
      font:700 10px/1.25 var(--font-display);
      letter-spacing:.11em;
      text-transform:uppercase;
      opacity:.58;
    }

    .chapter__company{
      margin:0;
      max-width:9ch;
      font:700 clamp(54px,7vw,116px)/.84 var(--font-display);
      letter-spacing:-.065em;
      text-transform:uppercase;
      overflow-wrap:normal;
      word-break:normal;
      hyphens:none;
    }

    .chapter__position{
      margin:18px 0 0;
      max-width:29ch;
      font:500 clamp(20px,2vw,30px)/1.08 var(--font-display);
    }

    .metrics{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      margin-top:36px;
      border:1px solid currentColor;
    }

    .metric{
      min-height:116px;
      padding:16px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      border-right:1px solid currentColor;
    }

    .metric:last-child{border-right:0}

    .metric strong{
      font:700 clamp(28px,3vw,46px)/.92 var(--font-display);
      letter-spacing:-.04em;
      white-space:nowrap;
    }

    .metric span{
      max-width:16ch;
      font-size:10px;
      line-height:1.3;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.62;
    }

    .metrics--two{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .metrics--two .metric:last-child{
      border-right:0;
    }

    .chapter-copy{
      margin-top:28px;
      max-width:64ch;
      padding-top:22px;
      border-top:1px solid currentColor;
      font-size:14px;
      line-height:1.6;
    }

    .story{
      display:grid;
      margin-top:36px;
      border-top:1px solid currentColor;
    }

    .story__row{
      display:grid;
      grid-template-columns:126px 1fr;
      gap:24px;
      padding:19px 0;
      border-bottom:1px solid currentColor;
    }

    .story__row small{
      font:700 10px/1.2 var(--font-display);
      letter-spacing:.1em;
      text-transform:uppercase;
      opacity:.5;
    }

    .story__row p{
      margin:0;
      max-width:68ch;
      font-size:14px;
      line-height:1.55;
    }

    .project-cta{
      display:inline-flex;
      align-items:center;
      justify-content:space-between;
      gap:26px;
      width:min(100%,520px);
      margin-top:28px;
      padding:17px 18px;
      color:var(--black);
      background:var(--cyan);
      border:1px solid var(--black);
      font:500 13px/1.2 var(--font-display);
      transition:transform .2s ease,box-shadow .2s ease;
    }

    .project-cta:hover{
      transform:translate(-3px,-3px);
      box-shadow:6px 6px 0 var(--black);
    }

    .project-cta span:last-child{font-size:19px}

    .artifact{
      position:relative;
      min-height:470px;
      aspect-ratio:1;
      overflow:hidden;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.16);
      border:1px solid currentColor;
    }

    .chapter--dark .artifact{
      background:#111;
      border-color:rgba(255,255,255,.28);
    }

    .artifact__shape{
      position:relative;
      width:68%;
      aspect-ratio:1;
      background:var(--gray);
      border-radius:30%;
      box-shadow:0 34px 80px rgba(0,0,0,.18);
      transform:rotate(-12deg);
    }

    .artifact__shape::before{
      content:"";
      position:absolute;
      top:10%;
      left:10%;
      width:52%;
      aspect-ratio:1;
      background:var(--cyan);
      border:1px solid var(--black);
      border-radius:50%;
    }

    .artifact__shape::after{
      content:"";
      position:absolute;
      right:10%;
      bottom:8%;
      width:34%;
      height:46%;
      background:var(--red);
      border:1px solid var(--black);
      border-radius:24px;
    }

    .chapter--red .artifact__shape::after{background:var(--white)}

    .artifact--klever{
      background:#111;
    }
    .artifact--space{
      background:linear-gradient(145deg,#f4f3f3 0%,#d9d6d6 55%,#ffffff 100%);
    }

    .space-can{
      position:relative;
      width:42%;
      height:68%;
      min-width:150px;
      border-radius:18% 18% 14% 14%;
      border:2px solid var(--black);
      background:var(--white);
      transform:rotate(-9deg);
      box-shadow:18px 28px 45px rgba(0,0,0,.2);
    }

    .space-can::before,
    .space-can::after{
      content:"";
      position:absolute;
      left:7%;
      right:7%;
      height:8%;
      border:2px solid var(--black);
      border-radius:50%;
      background:var(--gray);
    }

    .space-can::before{top:-4%}
    .space-can::after{bottom:-3%}

    .space-can__label{
      position:absolute;
      inset:22% 10% 18%;
      display:grid;
      place-items:center;
      text-align:center;
      color:var(--black);
      background:var(--cyan);
      border:1px solid var(--black);
      font:700 22px/.9 var(--font-display);
      letter-spacing:-.04em;
    }

    .space-can__ring{
      position:absolute;
      left:50%;
      top:8%;
      width:34%;
      aspect-ratio:1;
      transform:translateX(-50%);
      border:3px solid var(--black);
      border-radius:50%;
    }

    .project-hero--space{background:var(--light)}


    .klever-sheet{
      position:absolute;
      width:62%;
      height:76%;
      left:19%;
      top:12%;
      background:var(--light);
      border:2px solid var(--white);
      border-radius:16% 16% 10% 10%;
      transform:rotate(-7deg);
      box-shadow:0 24px 50px rgba(0,0,0,.35);
    }

    .klever-sheet::before,
    .klever-sheet::after{
      content:"";
      position:absolute;
      left:12%;
      right:12%;
      height:9px;
      background:var(--red);
    }

    .klever-sheet::before{top:20%}
    .klever-sheet::after{bottom:18%}

    .klever-pack{
      position:absolute;
      z-index:3;
      width:22%;
      height:34%;
      right:11%;
      bottom:13%;
      background:var(--red);
      border:2px solid var(--white);
      border-radius:14px;
      transform:rotate(12deg);
    }

    .klever-pack::after{
      content:"K";
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:var(--white);
      font:700 52px/1 var(--font-display);
    }

    .klever-handle{
      position:absolute;
      z-index:4;
      width:11%;
      height:18%;
      border:8px solid var(--cyan);
      border-bottom:0;
      border-radius:40px 40px 0 0;
    }

    .klever-handle--a{left:12%;top:23%;transform:rotate(-12deg)}
    .klever-handle--b{right:17%;top:23%;transform:rotate(12deg)}

    .artifact__label{
      position:absolute;
      left:18px;
      bottom:16px;
      font:700 10px/1.2 var(--font-display);
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:.65;
    }

    .project-hero{
      position:relative;
      min-height:92vh;
      overflow:hidden;
      padding:var(--pad);
      display:flex;
      align-items:flex-end;
      background:var(--light);
    }

    .project-hero::after{
      content:"";
      position:absolute;
      top:-10%;
      right:-8%;
      width:46vw;
      height:42vh;
      background:var(--red);
      clip-path:polygon(18% 0,100% 0,100% 75%,0 100%);
    }

    .project-hero__inner{
      position:relative;
      z-index:2;
      width:min(100%,var(--content));
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:56px;
      align-items:end;
    }

    .project-hero h1{
      margin:12px 0 0;
      max-width:9ch;
      font:700 clamp(58px,8vw,138px)/.84 var(--font-display);
      letter-spacing:-.07em;
      text-transform:uppercase;
    }

    .project-hero__lead{
      margin:0;
      max-width:56ch;
      font-size:clamp(17px,1.5vw,22px);
      line-height:1.45;
    }

    .project-body{
      padding:72px var(--pad) 100px;
    }

    .timeline-band{
      width:min(100%,var(--content));
      margin:0 auto 64px;
      padding:28px;
      background:var(--black);
      color:var(--white);
    }

    .timeline-band__grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:1px;
      background:rgba(255,255,255,.2);
    }

    .timeline-step{
      min-height:132px;
      padding:16px;
      background:var(--black);
    }

    .timeline-step strong{
      display:block;
      margin-bottom:28px;
      font:700 11px/1 var(--font-display);
      color:var(--cyan);
    }

    .timeline-step span{
      font-size:13px;
      line-height:1.4;
    }

    .project-flow{
      width:min(100%,var(--content));
      margin:0 auto;
      display:grid;
      gap:0;
    }

    .flow-section{
      display:grid;
      grid-template-columns:160px minmax(0,1fr);
      gap:42px;
      padding:58px 0;
      border-top:1px solid var(--black);
    }

    .flow-section__index{
      font:700 12px/1 var(--font-display);
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .flow-section__content{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(260px,.65fr);
      gap:42px;
      align-items:start;
    }

    .flow-section h2{
      margin:0;
      font:500 clamp(30px,4vw,58px)/.96 var(--font-display);
      letter-spacing:-.045em;
      max-width:16ch;
    }

    .flow-section p{
      margin:18px 0 0;
      max-width:68ch;
      font-size:16px;
      line-height:1.6;
    }

    .flow-callout{
      margin-top:26px;
      padding:18px 20px;
      background:var(--cyan);
      border:1px solid var(--black);
      font-size:14px;
      line-height:1.5;
    }

    .flow-artifact{
      min-height:260px;
      padding:18px;
      display:flex;
      align-items:flex-end;
      background:var(--gray);
      border:1px solid var(--black);
      font:700 10px/1.2 var(--font-display);
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .footer{
      margin-left:var(--sidebar);
      padding:28px var(--pad);
      display:flex;
      justify-content:space-between;
      gap:20px;
      color:var(--white);
      background:var(--black);
      font:700 10px/1 var(--font-display);
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    @media(max-width:1080px){
      :root{--sidebar:290px}
      .chapter__inner,.project-hero__inner{grid-template-columns:1fr}
      .artifact{max-width:540px;min-height:390px}
      .flow-section__content{grid-template-columns:1fr}
    }

    @media(max-width:820px){
      :root{--sidebar:100%}
      .sidebar{position:relative;width:100%;height:auto}
      .sidebar__inner{padding:20px}
      .photo{max-width:225px}
      .main,.footer{margin-left:0}
      .progress{left:0}
      .intro{min-height:72vh}
      .chapter{min-height:auto}
      .metrics{grid-template-columns:1fr}
      .metric{border-right:0;border-bottom:1px solid currentColor}
      .metric:last-child{border-bottom:0}
      .flow-section{grid-template-columns:1fr;gap:18px}
      .timeline-band__grid{grid-template-columns:1fr 1fr}
    }

    @media(max-width:560px){
      body{font-size:15px}
      .intro h2,.project-hero h1{font-size:clamp(48px,17vw,78px)}
      .chapter__company{font-size:clamp(48px,15vw,78px)}
      .artifact{min-height:300px}
      .story__row{grid-template-columns:1fr;gap:8px}
      .chapter__number{font-size:70px}
      .timeline-band__grid{grid-template-columns:1fr}
      .footer{flex-direction:column}
    }
  

    /* ===== SCROLL-LINKED PHOTO FOLLOW =====
   The whole flat photo rotates around its own center in the screen plane. */
const profilePhoto = document.querySelector('.photo');
let photoFollowRaf = 0;

function updatePhotoFollow() {
  photoFollowRaf = 0;
  if (!profilePhoto || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const activePage = document.querySelector('.page.is-active');
  if (!activePage) return;

  const headings = [...activePage.querySelectorAll('h1, h2')].filter(el => {
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
  if (!headings.length) return;

  const viewportCenter = window.innerHeight * 0.48;

  // The heading nearest the reading position controls the rotation.
  let heading = headings[0];
  let best = Infinity;
  for (const el of headings) {
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.height / 2) - viewportCenter);
    if (d < best) { best = d; heading = el; }
  }

  const r = heading.getBoundingClientRect();
  const distance = r.top + r.height / 2 - viewportCenter;
  const range = Math.max(window.innerHeight * 0.42, 300);
  const verticalProgress = Math.max(-1, Math.min(1, distance / range));

  // Ordinary 2D rotation: the entire photo rotates around its center.
  const rotation = verticalProgress * -18;
  profilePhoto.style.setProperty('--photo-rotation', rotation.toFixed(3) + 'deg');
}

function requestPhotoFollow() {
  if (!photoFollowRaf) photoFollowRaf = requestAnimationFrame(updatePhotoFollow);
}

function renderRoute() {
      const previousRoute = window.__currentRoute || null;
      const route = normalizeRoute();

      if (previousRoute === '/' && route !== '/') {
        sessionStorage.setItem(homeScrollKey, String(window.scrollY));
      }

      pages.forEach(page => {
        page.classList.toggle('is-active', page.dataset.route === route);
      });

      document.querySelectorAll('[data-nav-route]').forEach(link => {
        link.classList.toggle('is-active', link.dataset.navRoute === route);
      });

      const titles = {
        '/': 'Котляренко Владислав — Product Manager',
        '/about': 'Обо мне — Владислав Котляренко',
        '/lowcode': 'Low-code — Product Story',
        '/origami': 'Origami Wear — Product Story',
        '/obblic': 'Obblic — Product Story',
        '/klever': 'Клевер — Product Story',
        '/space-soda': 'Космос — Product Story'
      };

      document.title = titles[route] || titles['/'];

      if (route === '/') {
        if (previousRoute !== '/') restoreHomeScroll();
      } else {
        window.scrollTo(0, 0);
      }

      window.__currentRoute = route;
      updateProgress();
      requestPhotoFollow();
    }

    function updateProgress() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
      progressBar.style.width = Math.min(100, pct) + '%';
    }

    window.addEventListener('hashchange', renderRoute);
    window.addEventListener('scroll', () => { updateProgress(); saveHomeScroll(); requestPhotoFollow(); }, { passive: true });
    window.addEventListener('resize', () => { updateProgress(); requestPhotoFollow(); });


    document.querySelectorAll('.hobby-card').forEach(card => {
      const toggle = () => card.classList.toggle('is-open');
      card.addEventListener('click', toggle);
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggle();
        }
      });
    });

    document.getElementById('year').textContent = new Date().getFullYear();

    if (!location.hash) {
      history.replaceState(null, '', '#/');
    }

    renderRoute();
  </script>
</body>
</html>
